<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PC-8801、PC-9801、アニメ塗りに対応する画像変換ツール。ブラウザの中で画像を変換します。">
  <title>Digital8 Anime V4 | ブラウザ版</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">DIGITAL<span class="brand-eight">8</span></div>
    <a href="https://github.com/ruliciamisaki/digital8-public">GitHub ↗</a>
  </header>
  <main>
    <h1>Digital8 Anime V4 <small>ブラウザ版</small></h1>
    <div class="layout">
      <aside class="controls" aria-label="変換設定">
        <section class="panel">
          <h2>入力画像</h2>
          <label id="dropzone" class="dropzone">
            <input id="file" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif">
            <strong>画像を選ぶ / ドロップ</strong>
            <span>PNG・JPEG・WebP・BMP・GIF</span>
          </label>
          <p id="file-meta" class="muted"></p>
          <label id="original-label" class="file-button" hidden>
            元画像を選ぶ <input id="original" type="file" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif">
          </label>
        </section>
        <section class="panel">
          <h2>機種とパレット</h2>
          <div class="preset-row" aria-label="標準設定">
            <button type="button" class="preset" data-preset="pc8801">PC-8801</button>
            <button type="button" class="preset" data-preset="pc9801">PC-9801</button>
            <button type="button" class="preset" data-preset="anime">アニメ塗り</button>
          </div>
          <label class="field">パレット <select id="palette"></select></label>
          <div id="swatches" class="swatches" aria-label="パレットの色"></div>
          <details>
            <summary>パレット編集</summary>
            <div class="palette-edit">
              <label>選択色 <input id="colour-picker" type="color"></label>
              <label>HEX <input id="colour-hex" type="text" maxlength="7" pattern="#?[0-9a-fA-F]{6}"></label>
              <button id="add-colour" type="button">色を追加</button>
              <button id="remove-colour" type="button">色を削除</button>
              <label class="file-button">JSONを読み込む <input id="palette-file" type="file" accept=".json"></label>
              <button id="save-palette" type="button">JSONを保存</button>
            </div>
          </details>
        </section>
        <details class="panel" open>
          <summary>共通設定</summary>
          <div class="advanced-grid" id="common-numbers"></div>
          <label class="check"><input data-setting="tall_dots" type="checkbox"> 縦長ドット</label>
          <label class="check"><input data-setting="resize_640" type="checkbox"> 横幅640pxへ調整</label>
          <label class="check"><input data-setting="smooth_2x" type="checkbox"> 2倍拡大・1/2縮小（LANCZOS）</label>
          <label class="check"><input data-setting="colour_trace" type="checkbox"> 色トレス</label>
        </details>
        <details id="retro-settings" class="panel" open>
          <summary>V4 2色パターン</summary>
          <div class="advanced-grid">
            <label>1:1 混色 <select data-setting="half_tone">
              <option value="checker">市松 AB/BA</option><option value="vertical">縦縞 AB</option>
            </select></label>
            <label>3:1 混色 <select data-setting="quarter_tone">
              <option value="quarter_staggered">交互 AABA/BAAA</option><option value="quarter_single">片側 AB/AA</option>
            </select></label>
            <label>7:1 混色 <select data-setting="eighth_tone">
              <option value="eighth">従来 4×2</option><option value="eighth_staggered">交互 4×4</option>
            </select></label>
            <label>1:1:2 混色 <select data-setting="three_112">
              <option value="none">使わない</option><option value="three_112_stripes">縞 4×1</option>
              <option value="three_112_alternate">交互 4×2</option><option value="three_112_diagonal">斜め 4×4</option>
            </select></label>
            <label>1:1:1 混色 <select data-setting="three_111">
              <option value="none">使わない</option><option value="three_111_stripes">縞 3×1</option>
              <option value="three_111_diagonal">斜め 3×3</option>
            </select></label>
          </div>
          <div id="retro-numbers" class="advanced-grid"></div>
        </details>
        <details id="anime-settings" class="panel" open hidden>
          <summary>アニメ塗り</summary>
          <div id="anime-numbers" class="advanced-grid"></div>
          <label class="check"><input data-setting="white_transparent" type="checkbox"> 白 (#FFFFFF) を透明にする</label>
        </details>
        <details class="panel">
          <summary>色補正と透明度</summary>
          <div id="colour-numbers" class="advanced-grid"></div>
          <label class="field">透明度 <select data-setting="alpha_mode">
            <option value="preserve">そのまま保持</option><option value="binary">二値化</option>
          </select></label>
        </details>
        <section class="panel">
          <h2>プレビュー・保存</h2>
          <label class="check"><input id="auto-preview" type="checkbox"> プレビューを自動更新する</label>
          <div class="actions">
            <button id="preview" class="primary" type="button" disabled>プレビュー更新</button>
            <button id="cancel" class="secondary" type="button" hidden>中止</button>
          </div>
          <label class="field">出力形式 <select id="format">
            <option value="png">PNG</option><option value="psd">レイヤー付きPSD</option><option value="zip">レイヤー別PNG（ZIP）</option>
          </select></label>
          <label class="check"><input id="save-mask" type="checkbox"> 透明マスクも保存</label>
          <label class="check"><input id="invert-mask" type="checkbox"> マスクを反転</label>
          <div class="actions"><button id="download" class="secondary" type="button" disabled>変換・保存</button></div>
        </section>
        <p id="status" class="status" role="status" aria-live="polite">設定を読み込み中…</p>
      </aside>
      <section class="preview-area" aria-label="画像プレビュー">
        <div class="preview-head"><h2>プレビュー</h2><span id="dimensions">—</span></div>
        <div class="preview-tabs">
          <button id="show-result" type="button" disabled>変換結果</button>
          <button id="show-source" type="button" disabled>入力画像</button>
          <label for="zoom" class="zoom-label">倍率</label>
          <select id="zoom">
            <option value="fit">画面に収める</option>
            <option value="25">25%</option><option value="50">50%</option>
            <option value="75">75%</option><option value="100" selected>100%</option>
            <option value="150">150%</option><option value="200">200%</option>
          </select>
        </div>
        <div id="frame" class="canvas-frame">
          <p id="placeholder">画像を選ぶと、ここに表示されます。</p>
          <img id="source" alt="入力画像" hidden>
          <img id="output" alt="変換結果" hidden>
        </div>
      </section>
    </div>
    <footer>画像はブラウザの中で処理します。初回の変換時は実行環境を読み込みます。</footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
